# 推送 v* 标签时自动打包 Windows 安装包并上传到 GitHub Releases
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 让基于 JS 的 Action 在 Node 24 上运行，消除 Node 20 弃用警告（2026-06-16 起 runner 默认即 Node 24）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 跳过代码签名，避免 winCodeSign 解压符号链接在 Windows 上失败
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # CI 在美国，用官方源下载 Electron 更稳（本地 .npmrc 仍可用 npmmirror）
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v6

      # 仓库 .npmrc 指向 npmmirror，适合国内本地；Actions 在美国 runner 上易导致 electron 下载失败
      - name: Use npm official registry on CI
        run: echo registry=https://registry.npmjs.org/ > .npmrc

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 必须 --publish never：package.json 里配置了 publish.github，CI 打 tag 时会隐式上传并要求 GH_TOKEN
      - name: Build installer
        run: npm run build && npx electron-builder --win --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
          generate_release_notes: true
